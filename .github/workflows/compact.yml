name: Build serving layer (compaction)

# Compacts the per-agency raw files into one parquet per (product, fiscal year) under
# serve/, so queries glob ~20 files instead of thousands (no HuggingFace listing 429).
# Reads per-agency files by explicit URL from the manifest (no glob → no 429 here either).

on:
  workflow_dispatch:
    inputs:
      product:
        description: "contracts | assistance | both"
        default: "both"
      years:
        description: "comma-separated fiscal years, or blank for all present"
        default: ""

permissions:
  contents: read

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install duckdb huggingface_hub
      - name: Compact
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          ARGS=""
          P="${{ github.event.inputs.product }}"
          [ -n "$P" ] && [ "$P" != "both" ] && ARGS="--product $P"
          [ -n "${{ github.event.inputs.years }}" ] && ARGS="$ARGS --years ${{ github.event.inputs.years }}"
          python -m usaspending_archive.compact_serve $ARGS
