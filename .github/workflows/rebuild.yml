name: Rebuild downstream (serve → R2 → precompute)

# Runs after new raw data lands. Jobs pass data through HuggingFace + R2, not artifacts:
#   1. plan       — decide which (product, year) shards to compact (default: newest 2 FYs)
#   2. compact    — one PARALLEL job per shard: per-agency raw → serve/{product}/{fy}.parquet on HF
#   3. sync_r2    — copy serve/ from HF into Cloudflare R2 (the site's query backend)
#   4. precompute — read the serve layer from R2, regenerate the dashboard JSON, commit it
#
# Why sharded: a full 20-year × 2-product rebuild is ~40 groups and re-copies immutable
# history every run — that's what blew past the 6-hour job limit. Old years never change,
# so routine runs only recompact the newest FYs; a full backfill (years=all) fans out as
# many short parallel jobs (wall-clock ≈ the slowest single year, not the sum).

on:
  workflow_dispatch:
    inputs:
      product:
        description: "contracts | assistance | both"
        default: "both"
      years:
        description: "recent (newest 2 FYs) | all | comma-separated FYs"
        default: "recent"
  # NOT triggered by workflow_run on the ingestion. refresh.yml already dispatches this
  # workflow itself when the drain completes, and it passes the year list it wants
  # (current + prior FY + a rotating audit year). A workflow_run trigger fired a SECOND,
  # input-less run seconds later that silently fell back to years=recent — two full
  # rebuilds per drain, serialized by the concurrency group below, the redundant one
  # taking ~90 min and emailing a failure whenever it hit an R2 blip.

permissions:
  contents: write

concurrency:
  group: urgency-downstream
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      empty: ${{ steps.gen.outputs.empty }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Plan compaction shards
        id: gen
        env:
          # `gh workflow run` without -f applies the declared defaults; the || is a backstop.
          PRODUCT: ${{ github.event.inputs.product || 'both' }}
          YEARS: ${{ github.event.inputs.years || 'recent' }}
        run: python -m usaspending_archive.plan_compact

  compact:
    needs: plan
    if: ${{ needs.plan.outputs.empty != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90          # generous per-shard; a single year is minutes
    strategy:
      fail-fast: false           # one bad year shouldn't kill the rest
      max-parallel: 6            # keep HF uploads well under any rate limit
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q duckdb huggingface_hub
      - name: Compact ${{ matrix.product }} ${{ matrix.year }} → serve layer (HF)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m usaspending_archive.compact_serve --product ${{ matrix.product }} --years ${{ matrix.year }}

  sync_r2:
    needs: compact
    runs-on: ubuntu-latest
    # huggingface_hub's snapshot_download has no overall timeout — a single stalled
    # connection can hang the job for hours (observed twice: 88+ min once, hit this
    # 30-min guard once more). The per-request timeout + retry below is the real fix;
    # this stays as a backstop in case all retries still stall.
    timeout-minutes: 45
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download serve layer from HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Bounds each HTTP request (connect/read) so a stalled connection raises instead
          # of hanging indefinitely — the retry loop below then just resumes (snapshot_
          # download skips files already fully fetched).
          HF_HUB_DOWNLOAD_TIMEOUT: "60"
        run: |
          pip install -q "huggingface_hub>=0.25"
          python - <<'PY'
          import os
          import time
          from huggingface_hub import snapshot_download

          last_err = None
          for attempt in range(1, 4):
              try:
                  snapshot_download("abigailhaddad/usaspending-bulk-awards", repo_type="dataset",
                                    allow_patterns="serve/**", local_dir="hf_serve",
                                    token=os.environ["HF_TOKEN"])
                  break
              except Exception as e:
                  last_err = e
                  print(f"attempt {attempt}/3 failed ({e}); retrying...")
                  time.sleep(15)
          else:
              raise SystemExit(f"download failed after 3 attempts: {last_err}")
          PY
          du -sh hf_serve/serve
      - name: Upload serve layer to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.CF_R2_ACCOUNT_ID }}
          # R2 doesn't support the newer aws-cli default request checksums
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          # R2 intermittently 500s on CompleteMultipartUpload; the CLI's default
          # ~2 retries aren't enough, so let it back off and retry 5xx harder.
          AWS_MAX_ATTEMPTS: "10"
          AWS_RETRY_MODE: adaptive
        run: |
          # Outer retry on top of the per-request retries above: s3 sync is
          # incremental, so each pass only re-uploads what the last one failed to
          # land. Without this, one stray InternalError sinks the whole rebuild.
          for i in 1 2 3 4 5; do
            if aws s3 sync hf_serve/serve "s3://usaspending/bulk-awards/serve" \
                 --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --no-progress; then
              echo "R2 sync complete (pass $i)"; exit 0
            fi
            echo "R2 sync pass $i hit failures — retrying remaining objects"; sleep $((i * 10))
          done
          echo "::error::R2 sync still failing after 5 passes"
          exit 1

  precompute:
    needs: sync_r2
    runs-on: ubuntu-latest
    # Historical baseline ~22 min; bound it for the same reason as sync_r2. Headroom on top
    # of that covers precompute.py's with_retry backoff redoing a scan step after an R2 blip.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "duckdb==1.5.2"
      - name: Generate precomputed aggregates
        env:
          CF_R2_ACCOUNT_ID: ${{ secrets.CF_R2_ACCOUNT_ID }}
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_BUCKET: usaspending
          CF_R2_PREFIX: bulk-awards/
        run: python usaspending_archive/precompute.py
      - name: Commit precomputed JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/public/precomputed
          git commit -m "Regenerate precomputed dashboard aggregates [skip ci]" || { echo "no changes"; exit 0; }
          # main may have advanced while we ran — rebase onto it before pushing
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
