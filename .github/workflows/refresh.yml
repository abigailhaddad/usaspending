name: Backfill / refresh HF dataset

# Drains changed archive files into the HF dataset, then self-chains a fresh run
# (new runner IP) while files remain — the CDN locks an IP after ~15-20 files.
# The manifest (committed back each run) makes it resumable.

on:
  workflow_dispatch:
    inputs:
      max_files:
        description: "Max files this run (0 = default 200)"
        required: false
        default: "0"
      agency:
        description: "Limit to one agency code (blank = all). Use for a bounded test."
        required: false
        default: ""
      product:
        description: "Contracts | Assistance | blank (both)"
        required: false
        default: ""
      fiscal_years:
        description: "FYs to process (blank = current + prior FY; 'all' = full re-ingest)"
        required: false
        default: ""
  schedule:
    # Daily. The source re-publishes ~monthly, but on no fixed weekday (the last
    # three cycles all landed on the 6th: a Saturday, a Monday, a Thursday), so a
    # weekly poll left a new cycle unused for up to six days. A no-op poll costs
    # ~40s -- the whole cost of daily was the redundant serve rebuild it used to
    # trigger, which the "Rebuild serve layer" step below now gates. Deliberately
    # an odd minute, not :00: GitHub drops/delays scheduled runs most at the top
    # of the hour.
    - cron: "23 9 * * *"

permissions:
  contents: write   # commit the updated manifest
  actions: write    # self-chain via gh workflow run

concurrency:
  group: usaspending-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Backfill
        id: run
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          MAX="${{ github.event.inputs.max_files }}"
          ARG=""; [ -n "$MAX" ] && [ "$MAX" != "0" ] && ARG="--max-files $MAX"
          [ -n "${{ github.event.inputs.agency }}" ] && ARG="$ARG --agency ${{ github.event.inputs.agency }}"
          [ -n "${{ github.event.inputs.product }}" ] && ARG="$ARG --product ${{ github.event.inputs.product }}"
          [ -n "${{ github.event.inputs.fiscal_years }}" ] && ARG="$ARG --fiscal-years ${{ github.event.inputs.fiscal_years }}"
          python -m usaspending_archive.backfill $ARG | tee run.log
          grep -q CHAIN_NEEDED run.log && echo "chain=true" >> "$GITHUB_OUTPUT" || echo "chain=false" >> "$GITHUB_OUTPUT"
          # How many files this hop actually ingested, for the rebuild gate below.
          # backfill.py's last line is "processed N, M changed files remain"; a
          # missing/garbled line falls back to 0, which the weekly slot covers.
          PROCESSED=$(grep -oE '^processed [0-9]+' run.log | tail -1 | grep -oE '[0-9]+' || true)
          echo "processed=${PROCESSED:-0}" >> "$GITHUB_OUTPUT"

      - name: Commit manifest
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metadata/manifest.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "manifest unchanged"; exit 0
          fi
          git commit -m "Update manifest [skip ci]"
          # main moves under us (other chained runs + code pushes); rebase + retry
          for i in 1 2 3 4 5 6; do
            git pull --rebase --autostash origin "${{ github.ref_name }}" && git push && exit 0
            echo "push race, retry $i"; sleep $((RANDOM % 8 + 3))
          done
          echo "manifest push failed after retries (will reconcile next run)"

      - name: Chain next run if files remain
        if: always() && steps.run.outputs.chain == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The dispatch API 500s transiently; a single failure here silently
          # strands the drain (files remain, but nothing is queued to continue).
          # Retry with backoff before giving up, and fail loudly if we can't.
          for i in 1 2 3 4 5 6; do
            if gh workflow run refresh.yml --ref "${{ github.ref_name }}" \
                 -f max_files="${{ github.event.inputs.max_files }}" \
                 -f agency="${{ github.event.inputs.agency }}" \
                 -f product="${{ github.event.inputs.product }}" \
                 -f fiscal_years="${{ github.event.inputs.fiscal_years }}"; then
              echo "chained next run (attempt $i)"; exit 0
            fi
            echo "dispatch failed, retry $i"; sleep $((RANDOM % 8 + 7))
          done
          echo "::error::could not chain next backfill run after 6 attempts — drain is stranded, re-dispatch refresh.yml manually"
          exit 1

      # When the backfill is fully drained (no more files to chain), recompact the
      # serve layer + publish. Without this the raw layer advances but the serve
      # files everyone queries go stale.
      #
      # Gated on "this hop actually ingested something," OR Monday. Before the
      # schedule went daily this step ran on every drain-complete run including
      # no-op ones -- fine at one redundant ~30-90min rebuild per week ("idempotent
      # and cheap insurance"), not fine at seven, especially since the rotating
      # audit year below is keyed to the ISO WEEK and so would re-audit the same
      # year seven days running for no added coverage. Keeping the Monday slot
      # preserves that weekly no-op insurance exactly as it was; the processed>0
      # arm is what's new, and it means a cycle that lands on a Tuesday gets its
      # serve layer rebuilt that same day instead of six days later.
      - name: Rebuild serve layer when drain is complete
        if: always() && steps.run.outputs.chain == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Recompact current + prior FY (what a monthly update normally touches),
          # NOT all ~20 — recompacting everything wastes time and risks HF throttling.
          # PLUS one rotating older year per ISO week, so historical restatements get
          # caught too — the whole back-catalog gets re-audited over ~a quarter.
          Y=$(date -u +%Y); M=$(date -u +%m); FY=$Y; [ "$M" -ge 10 ] && FY=$((Y + 1))
          PREV=$((FY - 1)); FIRST=2008
          YEARS="$PREV,$FY"
          SPAN=$((PREV - FIRST))
          if [ "$SPAN" -gt 0 ]; then
            WEEK=$((10#$(date -u +%V)))      # ISO week, strip leading zero
            ROT=$((FIRST + WEEK % SPAN))     # cycles 2008..PREV-1
            YEARS="$ROT,$YEARS"
          fi
          PROCESSED="${{ steps.run.outputs.processed }}"
          if [ "${PROCESSED:-0}" -eq 0 ] && [ "$(date -u +%u)" != "1" ]; then
            echo "Nothing ingested this run and today is not the weekly insurance slot — skipping serve rebuild."
            exit 0
          fi
          echo "Backfill drained (processed ${PROCESSED:-0} file(s)) — rebuilding serve for years $YEARS (current+prior + rotating audit)."
          gh workflow run rebuild.yml --ref "${{ github.ref_name }}" -f product=both -f years="$YEARS"

      - name: Summary
        if: always()
        run: |
          { echo '## Backfill run'; echo '```'; cat run.log 2>/dev/null | tail -40; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
