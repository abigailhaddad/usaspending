name: Refresh reference tables

# Snapshot the reference/dimension tables (data dictionary, agency code↔name crosswalk,
# CFDA, DEF codes, glossary) and publish them to the HF dataset's reference/ folder.
# Runs on a GitHub runner (fresh IP) so files.usaspending.gov's agency_codes.csv isn't throttled.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pyarrow huggingface_hub
      - name: Snapshot + publish reference tables
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m usaspending_archive.reference_data
