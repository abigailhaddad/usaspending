name: Sync serve layer to R2

# Copies the published serving layer (serve/{dataset}/{fy}.parquet) from the public
# HuggingFace dataset into Cloudflare R2, under the bulk-awards/ prefix of the shared
# bucket. R2 is the low-latency, un-throttled backend the deployed site queries.
# Runs on a GitHub runner (fast network, no local machine, no HF rate-limiting).

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download serve layer from HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -q "huggingface_hub>=0.25"
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          p = snapshot_download(
              "abigailhaddad/usaspending-bulk-awards", repo_type="dataset",
              allow_patterns="serve/**", local_dir="hf_serve",
              token=os.environ["HF_TOKEN"])
          print("downloaded to", p)
          PY
          du -sh hf_serve/serve

      - name: Upload serve layer to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.CF_R2_ACCOUNT_ID }}
          # R2 doesn't support the newer aws-cli default request checksums
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          aws s3 sync hf_serve/serve "s3://usaspending/bulk-awards/serve" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --no-progress
          echo "---- R2 contents ----"
          aws s3 ls "s3://usaspending/bulk-awards/serve/contracts/" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" | head
